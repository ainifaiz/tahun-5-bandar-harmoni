<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Mata Kumpulan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap');
:root{--ink:#172554;--muted:#64748b;--gold:#f59e0b}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#dbeafe,#f8fafc 48%,#fef3c7);color:var(--ink);font-family:Nunito,Arial,sans-serif}
.shell{max-width:1280px;margin:auto;padding:24px}.hero{display:flex;align-items:center;gap:18px;padding:20px 24px;background:#fffffff0;border-radius:28px;box-shadow:0 14px 35px #2563eb22}.hero-icon{font-size:clamp(45px,7vw,76px)}h1{margin:0;font-family:'Baloo 2';font-size:clamp(2.1rem,5vw,4rem);line-height:.9}.eyebrow,.label{margin:0;color:#2563eb;letter-spacing:.14em;font-size:.75rem;font-weight:900}.tagline{margin:9px 0 0;color:var(--muted);font-size:1.1rem}.full{margin-left:auto;border:0;background:#eff6ff;color:#1d4ed8;border-radius:15px;width:54px;height:54px;font-size:1.6rem;cursor:pointer}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 14px;padding:13px;background:#ffffffb8;border-radius:20px}.toolbar div{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:2px solid #dbeafe;background:white;color:#1e3a8a;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.btn:hover{transform:translateY(-2px)}.add{background:#2563eb;color:white}.reset{color:#b91c1c;border-color:#fecaca}
.status{text-align:center;background:white;border-radius:21px;padding:17px;margin-bottom:18px;box-shadow:0 8px 22px #0f172a14}.winner{font-family:'Baloo 2';font-size:clamp(1.4rem,3vw,2.2rem);font-weight:800;color:#1e40af}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px}.card{--accent:#2563eb;position:relative;overflow:hidden;background:white;border:4px solid color-mix(in srgb,var(--accent) 38%,white);border-radius:24px;padding:18px;box-shadow:0 10px 20px #0f172a14}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--accent)}.card.best{border-color:var(--gold);box-shadow:0 0 0 4px #fde68a,0 16px 30px #f59e0b40;animation:glow 1.8s infinite}.badge{position:absolute;right:12px;top:17px;background:#fef3c7;color:#92400e;border-radius:99px;padding:5px 9px;font-size:.7rem}.top{display:flex;gap:9px;align-items:center;margin-top:6px}.rank{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,white);color:var(--accent)}.name{min-width:0;flex:1;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:8px;padding:5px;font-size:1.28rem;font-weight:900}.name:focus{border-color:#93c5fd;background:#eff6ff;outline:0}.scorebox{text-align:center;padding:18px 0 8px}.score{font-family:'Baloo 2';font-size:clamp(4.2rem,9vw,6.5rem);line-height:.82;color:var(--accent)}.scorebox small{display:block;margin-top:10px;color:var(--muted);letter-spacing:.14em;font-size:.72rem}.bar{height:11px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:12px 0 16px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:.35s}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scorebtn{border:0;border-radius:13px;padding:12px 5px;font-weight:900;cursor:pointer}.plus{background:#dcfce7;color:#166534}.minus{background:#fee2e2;color:#991b1b}.minus:disabled{opacity:.4}.colors{text-align:center;margin:15px 0 2px}.dot{width:22px;height:22px;border-radius:50%;border:3px solid transparent;margin:2px;cursor:pointer}.dot.active{border-color:#172554;transform:scale(1.15)}.remove{border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:.78rem;font-weight:900;position:absolute;right:12px;bottom:12px}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.84rem;margin-top:18px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#172554;color:white;padding:12px 18px;border-radius:99px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes glow{50%{transform:translateY(-4px)}}@media(max-width:620px){.shell{padding:13px}.hero{padding:17px 14px}.toolbar>div{width:100%}.toolbar .btn{flex:1;font-size:.8rem;padding:10px 6px}.grid{gap:13px}.full{width:45px;height:45px}}
</style>
</head>
<body><main class="shell">
<header class="hero"><div class="hero-icon">🏆</div><div><p class="eyebrow">AKTIVITI PEMBELAJARAN</p><h1>SISTEM MATA KUMPULAN</h1><p class="tagline">Kumpul mata, bekerjasama dan jadi juara!</p></div><button class="full" id="full" title="Mod skrin penuh">⛶</button></header>
<section class="toolbar"><div><span class="label">PAPARAN</span><button class="btn" id="sort">↕ Susun ikut mata</button><button class="btn" id="rank">👁 Sembunyi kedudukan</button></div><div><button class="btn add" id="add">＋ Tambah kumpulan</button><button class="btn reset" id="reset">↺ Tetapkan semula</button></div></section>
<section class="status" aria-live="polite"><p class="label">KEPUTUSAN SEMASA</p><div class="winner" id="winner">Mulakan aktiviti anda!</div></section>
<section class="grid" id="grid"></section>
<footer class="footer"><span>💡 Tekan <strong>+1</strong> atau <strong>+5</strong> untuk menambah mata.</span><span>✓ Disimpan pada peranti ini</span></footer>
</main><div class="toast" id="toast"></div>
<script>
var palette=['#2563eb','#16a34a','#f97316','#9333ea','#db2777'];
var saved=localStorage.getItem('mata-kumpulan-v1');
var groups=saved?JSON.parse(saved):[['Kumpulan Biru',0],['Kumpulan Hijau',0],['Kumpulan Oren',0]].map(function(x,i){return{id:Date.now()+i,name:x[0],score:x[1],color:palette[i]};});
var sorted=false,showRank=true,grid=document.getElementById('grid'),toast=document.getElementById('toast');
function save(){localStorage.setItem('mata-kumpulan-v1',JSON.stringify(groups));}
function msg(s){toast.textContent=s;toast.className='toast show';clearTimeout(msg.t);msg.t=setTimeout(function(){toast.className='toast';},1400);}
function safe(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c];});}
function render(){
 var list=sorted?groups.slice().sort(function(a,b){return b.score-a.score;}):groups.slice();
 var max=Math.max.apply(null,groups.map(function(g){return g.score;}).concat([0]));
 var win=groups.filter(function(g){return max>0&&g.score===max;});
 document.getElementById('winner').textContent=!max?'Mulakan aktiviti anda!':win.length>1?'🤝 Markah Seri! '+win.map(function(g){return g.name;}).join(' dan '):'🏆 KUMPULAN TERBAIK: '+win[0].name;
 grid.innerHTML='';
 list.forEach(function(g){
  var rank=groups.filter(function(x){return x.score>g.score;}).length+1,isBest=max>0&&g.score===max;
  var c=document.createElement('article');c.className='card'+(isBest?' best':'');c.style.setProperty('--accent',g.color);
  c.innerHTML=(isBest?'<div class="badge">🏆 TERBAIK</div>':'')+'<div class="top"><span class="rank">'+(showRank?'#'+rank:'⭐')+'</span><input class="name" value="'+safe(g.name)+'" aria-label="Nama kumpulan"><span>✏️</span></div><div class="scorebox"><div class="score">'+g.score+'</div><small>MATA</small></div><div class="bar"><i style="width:'+(max?Math.min(100,g.score/max*100):0)+'%"></i></div><div class="controls"><button class="scorebtn plus" data-d="1">＋1 mata</button><button class="scorebtn plus" data-d="5">＋5 mata</button><button class="scorebtn minus" data-d="-1" '+(g.score===0?'disabled':'')+'>−1 mata</button><button class="scorebtn minus" data-d="-5" '+(g.score===0?'disabled':'')+'>−5 mata</button></div><div class="colors">'+palette.map(function(col){return'<button class="dot '+(col===g.color?'active':'')+'" style="background:'+col+'" data-c="'+col+'" aria-label="Tukar warna"></button>';}).join('')+'</div><button class="remove" data-remove>✕ Buang kumpulan</button>';
  c.querySelector('.name').onchange=function(e){g.name=e.target.value.trim()||'Kumpulan';save();render();};
  c.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){g.score=Math.max(0,g.score+Number(b.dataset.d));save();render();msg(Number(b.dataset.d)>0?'Mata ditambah!':'Mata ditolak!');};});
  c.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){g.color=b.dataset.c;save();render();};});
  c.querySelector('[data-remove]').onclick=function(){if(groups.length<=2)return msg('Minimum ialah 2 kumpulan.');groups=groups.filter(function(x){return x.id!==g.id;});save();render();msg('Kumpulan dibuang.');};
  grid.appendChild(c);
 });
}
document.getElementById('add').onclick=function(){if(groups.length>=5)return msg('Maksimum 5 kumpulan.');groups.push({id:Date.now(),name:'Kumpulan '+(groups.length+1),score:0,color:palette[groups.length]});save();render();msg('Kumpulan ditambah.');};
document.getElementById('reset').onclick=function(){if(confirm('Tetapkan semua markah kepada sifar?')){groups.forEach(function(g){g.score=0;});save();render();msg('Markah ditetapkan semula.');}};
document.getElementById('sort').onclick=function(){sorted=!sorted;this.textContent=sorted?'↕ Susun asal':'↕ Susun ikut mata';render();};
document.getElementById('rank').onclick=function(){showRank=!showRank;this.textContent=showRank?'👁 Sembunyi kedudukan':'👁 Papar kedudukan';render();};
document.getElementById('full').onclick=function(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}};
render();
</script></body></html>
